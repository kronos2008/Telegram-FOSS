workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install tools
        script: |
          brew install ninja cmake go wget

      - name: Download NDK
        script: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -q android-ndk-r21e-darwin-x86_64.zip
          mkdir -p $ANDROID_HOME/ndk/21.4.7075529
          mv android-ndk-r21e/* $ANDROID_HOME/ndk/21.4.7075529/
          rm -rf android-ndk-r21e*

      - name: Build native libs
        script: |
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=/usr/local/bin/ninja
          chmod +x *.sh
          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh
          cd ../../

      # ПРОВЕРЯЕМ ОБА ВАРИАНТА ФАЙЛА
      - name: Check both API_KEYS files
        script: |
          echo "=== Поиск API_KEYS ==="
          echo "Корневая папка: $(pwd)"
          echo "Содержимое:"
          ls -la
          echo ""
          echo "Поиск API_KEYS (без расширения):"
          find . -name "API_KEYS" -type f 2>/dev/null || echo "Не найден"
          echo ""
          echo "Поиск API_KEYS.txt:"
          find . -name "API_KEYS.txt" -type f 2>/dev/null || echo "Не найден"
          echo ""
          echo "Содержимое API_KEYS.txt (если есть):"
          cat API_KEYS.txt 2>/dev/null || echo "Файл не существует"
          echo ""
          echo "Содержимое API_KEYS (если есть):"
          cat API_KEYS 2>/dev/null || echo "Файл не существует"

      # КОПИРУЕМ ЛЮБОЙ НАЙДЕННЫЙ ФАЙЛ
      - name: Copy keys to TMessagesProj
        script: |
          if [ -f "API_KEYS.txt" ]; then
            echo "Копируем API_KEYS.txt"
            cp API_KEYS.txt TMessagesProj/API_KEYS
          elif [ -f "API_KEYS" ]; then
            echo "Копируем API_KEYS"
            cp API_KEYS TMessagesProj/
          else
            echo "НИ ОДИН ФАЙЛ НЕ НАЙДЕН!"
            exit 1
          fi

      # ПАТЧИМ build.gradle
      - name: Patch build.gradle
        script: |
          echo "Патчим build.gradle для правильного пути"
          sed -i '' 's|\.\/API_KEYS|\.\/TMessagesProj\/API_KEYS|g' TMessagesProj/build.gradle 2>/dev/null || \
          sed -i 's|\.\/API_KEYS|\.\/TMessagesProj\/API_KEYS|g' TMessagesProj/build.gradle

      # СБОРКА
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleAfatRelease

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk

    publishing:
      email:
        recipients:
          - washingtonfizcl@gmail.com
