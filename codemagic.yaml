workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      # 1. Установка инструментов
      - name: Install build tools
        script: |
          brew install ninja cmake go wget yasm

      # 2. Скачивание правильной версии NDK
      - name: Download NDK r21e
        script: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -q android-ndk-r21e-darwin-x86_64.zip
          mkdir -p $ANDROID_HOME/ndk/21.4.7075529
          mv android-ndk-r21e/* $ANDROID_HOME/ndk/21.4.7075529/
          rm -rf android-ndk-r21e*

      # 3. Настройка NDK (БЕЗ ndk.dir - убираем предупреждения)
      - name: Setup NDK version
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Устанавливаем NDK версию в gradle.properties (современный способ)
          echo "android.ndkVersion=21.4.7075529" >> gradle.properties
          echo "=== local.properties ==="
          cat local.properties
          echo "=== gradle.properties ==="
          cat gradle.properties

      # 4. Создание API_KEYS (ЗАМЕНИ НА СВОИ ЗНАЧЕНИЯ!)
      - name: Create API_KEYS file
        script: |
          echo "APP_ID = 32444842" > API_KEYS
          echo "APP_HASH = cbf37857fa6fe0fa2861de75661d2509" >> API_KEYS
          echo "=== API_KEYS ==="
          cat API_KEYS

      # 5. Подготовка нативных зависимостей
      - name: Prepare native libs
        script: |
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export PATH="$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin:$PATH"
          
          # Патчим скрипты (меняем linux на darwin)
          for script in build_*.sh; do
            echo "Патчим $script"
            sed -i '' 's/linux-x86_64/darwin-x86_64/g' "$script" 2>/dev/null || true
          done
          
          chmod +x *.sh
          
          # Сборка libvpx
          echo "=== Building libvpx ==="
          ./build_libvpx_clang.sh 2>&1 | tee libvpx.log || echo "libvpx build failed but continuing"
          
          # Сборка FFmpeg
          echo "=== Building FFmpeg ==="
          export CFLAGS="-Wno-error=unused-command-line-argument"
          ./build_ffmpeg_clang.sh 2>&1 | tee ffmpeg.log || echo "FFmpeg build failed but continuing"
          
          # Патчи
          ./patch_ffmpeg.sh 2>&1 | tee ffmpeg_patch.log || true
          ./patch_boringssl.sh 2>&1 | tee boringssl_patch.log || true
          
          # Сборка BoringSSL
          ./build_boringssl.sh 2>&1 | tee boringssl.log || echo "BoringSSL build failed but continuing"
          
          cd ../../

      # 6. Патчинг build.gradle
      - name: Patch Gradle files
        script: |
          # Убираем проблемные места
          sed -i '' '/if.*externalNativeBuild/,/}/d' TMessagesProj/build.gradle 2>/dev/null || true
          sed -i '' '/abiFilters/d' TMessagesProj/build.gradle 2>/dev/null || true
          
          # Добавляем CMake аргументы
          echo "" >> gradle.properties
          echo "# CMake arguments" >> gradle.properties
          echo "android.externalNativeBuild.cmake.arguments=-DANDROID_PLATFORM=android-21,-DANDROID_TOOLCHAIN=clang,-DANDROID_STL=c++_shared" >> gradle.properties

      # 7. Поиск доступных задач (диагностика)
      - name: List available tasks
        script: |
          chmod +x gradlew
          ./gradlew tasks | grep -E "assemble|ndk|external" | head -20

      # 8. ФИНАЛЬНАЯ СБОРКА (несколько попыток)
      - name: Build APK
        script: |
          chmod +x gradlew
          
          # Попытка 1: стандартная сборка
          echo "=== Попытка 1: Стандартная сборка ==="
          ./gradlew clean
          ./gradlew assembleAfatRelease 2>&1 | tee build.log || \
          
          # Попытка 2: без NDK задач
          echo "=== Попытка 2: Без NDK ==="
          ./gradlew assembleAfatRelease -x compileDebugNdk -x compileReleaseNdk -x externalNativeBuild 2>&1 | tee build2.log || \
          
          # Попытка 3: только Java
          echo "=== Попытка 3: Только Java ==="
          ./gradlew assembleAfatRelease -x ndkBuild -x generateJsonModel -x externalNativeBuild 2>&1 | tee build3.log

    artifacts:
      # Сохраняем всё, что может пригодиться
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
      - TMessagesProj/jni/*.log
      - "*.log"
      - build.log
      - build2.log
      - build3.log

    publishing:
      email:
        recipients:
          - washingtonfizcl@gmail.com
