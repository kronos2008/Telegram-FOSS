workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install tools
        script: |
          brew install ninja cmake go wget yasm

      - name: Download NDK
        script: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -q android-ndk-r21e-darwin-x86_64.zip
          mkdir -p $ANDROID_HOME/ndk/21.4.7075529
          mv android-ndk-r21e/* $ANDROID_HOME/ndk/21.4.7075529/
          rm -rf android-ndk-r21e*

      # ИСПРАВЛЕННАЯ СБОРКА NATIVE LIBs
      - name: Build native libs
        script: |
          set -e
          cd TMessagesProj/jni
          
          # Правильный путь к NDK для Mac
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=/usr/local/bin/ninja
          
          # Исправляем скрипты сборки (заменяем linux на darwin)
          echo "=== Исправляем пути в скриптах ==="
          for script in build_*.sh; do
            echo "Патчим $script"
            sed -i '' 's/linux-x86_64/darwin-x86_64/g' "$script" 2>/dev/null || \
            sed -i 's/linux-x86_64/darwin-x86_64/g' "$script"
          done
          
          # Делаем скрипты исполняемыми
          chmod +x *.sh
          
          # 1. Сборка libvpx
          echo "=== Building libvpx ==="
          ./build_libvpx_clang.sh 2>&1 | tee libvpx.log
          
          # 2. Сборка FFmpeg
          echo "=== Building FFmpeg ==="
          export PATH="/opt/homebrew/bin:$PATH"
          ./build_ffmpeg_clang.sh 2>&1 | tee ffmpeg.log
          
          # 3. Патчи
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          
          # 4. Сборка BoringSSL
          echo "=== Building BoringSSL ==="
          ./build_boringssl.sh 2>&1 | tee boringssl.log
          
          # Проверка
          echo "=== Проверка библиотек ==="
          find . -name "*.a" -type f | sort
          cd ../../

      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleAfatRelease

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
      - TMessagesProj/jni/*.log
