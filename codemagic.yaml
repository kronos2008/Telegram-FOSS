workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install tools
        script: |
          brew install ninja cmake

      - name: Build native libs (simplified)
        script: |
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk-bundle
          # Пытаемся собрать только необходимое
          chmod +x *.sh
          ./build_libvpx_clang.sh || true
          ./build_ffmpeg_clang.sh || true
          ./patch_ffmpeg.sh || true
          ./patch_boringssl.sh || true
          ./build_boringssl.sh || true
          cd ../../

      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease -x compileDebugNdk -x compileReleaseNdk

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
