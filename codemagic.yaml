workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install tools
        script: |
          brew install ninja cmake go wget yasm

      - name: Download NDK
        script: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -q android-ndk-r21e-darwin-x86_64.zip
          mkdir -p $ANDROID_HOME/ndk/21.4.7075529
          mv android-ndk-r21e/* $ANDROID_HOME/ndk/21.4.7075529/
          rm -rf android-ndk-r21e*

      # ПОЛНАЯ ПЕРЕСБОРКА FFMPEG С ДИАГНОСТИКОЙ
      - name: Build FFmpeg manually
        script: |
          set -e  # Останавливать скрипт при любой ошибке
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=/usr/local/bin/ninja
          
          # Полная очистка
          echo "=== Очистка старых сборок ==="
          rm -rf ffmpeg/build
          rm -rf boringssl/build
          
          # Делаем скрипты исполняемыми
          chmod +x *.sh
          
          # 1. Сборка libvpx
          echo "=== 1/5: Building libvpx ==="
          ./build_libvpx_clang.sh 2>&1 | tee libvpx_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: libvpx build failed"
            exit 1
          fi
          
          # 2. Сборка FFmpeg
          echo "=== 2/5: Building FFmpeg ==="
          # Временно добавляем yasm в PATH (иногда требуется)
          export PATH="/opt/homebrew/bin:$PATH"
          ./build_ffmpeg_clang.sh 2>&1 | tee ffmpeg_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: FFmpeg build failed"
            exit 1
          fi
          
          # 3. Патч FFmpeg
          echo "=== 3/5: Patching FFmpeg ==="
          ./patch_ffmpeg.sh 2>&1 | tee ffmpeg_patch.log
          
          # 4. Патч BoringSSL
          echo "=== 4/5: Patching BoringSSL ==="
          ./patch_boringssl.sh 2>&1 | tee boringssl_patch.log
          
          # 5. Сборка BoringSSL
          echo "=== 5/5: Building BoringSSL ==="
          ./build_boringssl.sh 2>&1 | tee boringssl_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: BoringSSL build failed"
            exit 1
          fi
          
          # Финальная проверка
          echo "=== Проверка созданных библиотек ==="
          find . -name "*.a" -type f | sort
          
          # Специальная проверка для недостающего файла
          echo "=== Поиск libswscale.a ==="
          find . -name "libswscale.a" -type f
          
          cd ../../

      # Сборка APK
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleAfatRelease

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
      - TMessagesProj/jni/*.log

    publishing:
      email:
        recipients:
          - washingtonfizcl@gmail.com
