workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      # 1. Установка инструментов
      - name: Install build tools
        script: |
          brew install ninja cmake go wget yasm

      # 2. Скачивание правильной версии NDK
      - name: Download NDK r21e
        script: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -q android-ndk-r21e-darwin-x86_64.zip
          mkdir -p $ANDROID_HOME/ndk/21.4.7075529
          mv android-ndk-r21e/* $ANDROID_HOME/ndk/21.4.7075529/
          rm -rf android-ndk-r21e*

      # 3. Создание local.properties с правильными путями
      - name: Setup local.properties
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      # 4. Создание API_KEYS (ЗАМЕНИ НА СВОИ ЗНАЧЕНИЯ!)
      - name: Create API_KEYS file
        script: |
          echo "APP_ID = 32444842" > API_KEYS
          echo "APP_HASH = cbf37857fa6fe0fa2861de75661d2509" >> API_KEYS

      # 5. Подготовка нативных зависимостей (исправленная)
      - name: Prepare native libs
        script: |
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export PATH="$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin:$PATH"
          
          # Патчим скрипты (меняем linux на darwin)
          for script in build_*.sh; do
            sed -i '' 's/linux-x86_64/darwin-x86_64/g' "$script" 2>/dev/null || true
          done
          
          chmod +x *.sh
          
          # Сборка libvpx
          echo "=== Building libvpx ==="
          ./build_libvpx_clang.sh || echo "libvpx build failed but continuing"
          
          # Сборка FFmpeg с дополнительными флагами
          echo "=== Building FFmpeg ==="
          export CFLAGS="-Wno-error=unused-command-line-argument"
          ./build_ffmpeg_clang.sh || echo "FFmpeg build failed but continuing"
          
          # Патчи
          ./patch_ffmpeg.sh || true
          ./patch_boringssl.sh || true
          
          # Сборка BoringSSL
          ./build_boringssl.sh || echo "BoringSSL build failed but continuing"
          
          cd ../../

      # 6. Патчинг build.gradle (убираем проблемные места)
      - name: Patch Gradle files
        script: |
          # Убираем проверки на NDK из build.gradle
          sed -i '' '/if.*externalNativeBuild/,/}/d' TMessagesProj/build.gradle 2>/dev/null || true
          sed -i '' '/abiFilters/d' TMessagesProj/build.gradle 2>/dev/null || true
          
          # Добавляем флаг для пропуска NDK
          echo "android.externalNativeBuild.cmake.arguments \"-DANDROID_PLATFORM=android-21\"" >> gradle.properties
          echo "android.externalNativeBuild.cmake.arguments \"-DANDROID_TOOLCHAIN=clang\"" >> gradle.properties

      # 7. ФИНАЛЬНАЯ СБОРКА
      - name: Build APK
        script: |
          chmod +x gradlew
          # Пробуем разные варианты сборки
          echo "=== Попытка 1: с пропуском NDK ==="
          ./gradlew clean
          ./gradlew assembleAfatRelease -x compileDebugNdk -x compileReleaseNdk -x externalNativeBuild || \
          
          echo "=== Попытка 2: без пропуска ==="
          ./gradlew assembleAfatRelease || \
          
          echo "=== Попытка 3: только Java компиляция ==="
          ./gradlew assembleAfatRelease -x ndkBuild -x generateJsonModel

    artifacts:
      # Сохраняем всё, что может пригодиться
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
      - TMessagesProj/jni/*.log
      - *.log

    publishing:
      email:
        recipients:
          - washingtonfizcl@gmail.com
