workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install tools
        script: |
          brew install ninja cmake go wget

      - name: Download NDK
        script: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -q android-ndk-r21e-darwin-x86_64.zip
          mkdir -p $ANDROID_HOME/ndk/21.4.7075529
          mv android-ndk-r21e/* $ANDROID_HOME/ndk/21.4.7075529/
          rm -rf android-ndk-r21e*

      # ПОДРОБНАЯ СБОРКА НАТИВНЫХ ЗАВИСИМОСТЕЙ
      - name: Build native libs with debug
        script: |
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=/usr/local/bin/ninja
          
          # Делаем все скрипты исполняемыми
          chmod +x *.sh
          
          # Чистим предыдущие сборки
          rm -rf ffmpeg/build
          rm -rf boringssl/build
          
          # Собираем libvpx с выводом ошибок
          echo "=== Building libvpx ==="
          ./build_libvpx_clang.sh 2>&1 | tee libvpx.log
          
          # Собираем FFmpeg с подробным выводом
          echo "=== Building FFmpeg ==="
          ./build_ffmpeg_clang.sh 2>&1 | tee ffmpeg.log
          
          # Применяем патчи
          echo "=== Patching FFmpeg ==="
          ./patch_ffmpeg.sh 2>&1 | tee patch_ffmpeg.log
          
          echo "=== Patching BoringSSL ==="
          ./patch_boringssl.sh 2>&1 | tee patch_boringssl.log
          
          # Собираем BoringSSL
          echo "=== Building BoringSSL ==="
          ./build_boringssl.sh 2>&1 | tee boringssl.log
          
          # Проверяем, создались ли нужные файлы
          echo "=== Проверка созданных библиотек ==="
          find . -name "*.a" -type f | sort
          
          cd ../../

      # Сборка APK
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleAfatRelease

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
      - TMessagesProj/jni/*.log

    publishing:
      email:
        recipients:
          - washingtonfizcl@gmail.com
