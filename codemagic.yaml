workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
    scripts:
      - name: Install tools
        script: |
          brew install ninja cmake

      # Сборка без NDK (используем то, что есть)
      - name: Build APK (without NDK)
        script: |
          chmod +x gradlew
          # Чистим и собираем, пропуская NDK задачи
          ./gradlew clean
          ./gradlew assembleAfatRelease -x compileDebugNdk -x compileReleaseNdk -x externalNativeBuild

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk
