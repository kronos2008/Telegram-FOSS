workflows:
  telegram-foss-workflow:
    name: Build Telegram-FOSS APK
    max_build_duration: 60
    environment:
      vars:
        CM_BUILD_NUMBER: $BUILD_NUMBER
      android_sdk:
        ndk: 21.4.7075529
    scripts:
      # 1. Устанавливаем необходимые инструменты
      - name: Install build tools
        script: |
          brew install ninja cmake go

      # 2. Сборка нативных зависимостей
      - name: Build native dependencies
        script: |
          cd TMessagesProj/jni
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=/usr/local/bin/ninja
          chmod +x *.sh
          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh
          cd ../../

      # 3. Сборка APK
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleAfatRelease

    artifacts:
      - TMessagesProj/build/outputs/apk/afat/release/*.apk

    publishing:
      email:
        recipients:
          - washingtonfizcl@gmail.com
